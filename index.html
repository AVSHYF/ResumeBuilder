<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ATS Resume Builder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<h1 class="text-center my-4 page-title">
    Create Your Resume
</h1>

<div class="container-fluid">

<div class="row">
    <div class="col-md-6">

    <!-- ========================= -->
    <!-- RESUME PREVIEW -->
    <!-- ========================= -->
     <div class="d-flex justify-content-between align-items-center mb-3">

    <h4 class="fw-bold">
        Resume Preview
    </h4>

    <button
        id="downloadResume"
        class="btn btn-primary">

        <i class="bi bi-file-earmark-arrow-down me-2"></i>

        Download PDF

    </button>

</div>

    

        <div class="resume" id="resumePreview">

            <h1 id="p_name"></h1>

            <p id="p_role"></p>


            <!-- Contact -->

            <div class="contact">

                <span id="p_mail"></span>

                <span id="mail_separator"></span>

                <span id="p_phone"></span>

                <span id="phone_separator"></span>

                <span id="p_address"></span>

            </div>


            <!-- About -->

            <div class="section">

                <div class="section-title">
                    Professional Summary
                </div>

                <p id="p_about"></p>

            </div>


            <!-- Experience -->

            <div class="section">

                <div class="section-title">
                    Experience
                </div>

                <div
                    class="company"
                    id="p_company">
                </div>

                <div
                    class="exp-role"
                    id="p_exp_role">
                </div>

                <div class="exp-date">

                    <span id="p_start_date"></span>

                    <span id="date_separator"></span>

                    <span id="p_end_date"></span>

                </div>

                <p id="p_desc"></p>

            </div>


            <!-- Education -->

            <div class="section">

                <div class="section-title">
                    Education
                </div>

                <div
                    class="institute"
                    id="p_institute">
                </div>

                <div
                    class="department"
                    id="p_department">
                </div>

                <div>
                    <span id="p_passout"></span>
                </div>

                <div
                    class="percentage"
                    id="p_percentage">
                </div>

            </div>


            <!-- Skills -->

            <div class="section">

                <div class="section-title">
                    Skills
                </div>

                <div
                    class="skill-list"
                    id="p_skill">
                </div>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- FORM -->
    <!-- ========================= -->

    <div class="col-md-6 resume-form">

        <div class="accordion" id="resumeAccordion">


            <!-- Personal Details -->

            <div class="accordion-item">

                <h2 class="accordion-header">

                    <button
                        class="accordion-button"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#personal">

                        Personal Details

                    </button>

                </h2>


                <div
                    id="personal"
                    class="accordion-collapse collapse show">

                    <div class="accordion-body">

                        <label>Name</label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name">

                        <br><br>


                        <label>Role</label>

                        <input
                            type="text"
                            id="role"
                            placeholder="Example: Software Tester">

                        <br><br>


                        <label>Email</label>

                        <input
                            type="email"
                            id="mail"
                            placeholder="Enter email">

                        <br><br>


                        <label>Phone</label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter phone number">

                        <br><br>


                        <label>Location</label>

                        <input
                            type="text"
                            id="address"
                            placeholder="Example: Madurai, Tamil Nadu">

                    </div>

                </div>

            </div>


            <!-- Summary -->

            <div class="accordion-item">

                <h2 class="accordion-header">

                    <button
                        class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#summary">

                        Professional Summary

                    </button>

                </h2>


                <div
                    id="summary"
                    class="accordion-collapse collapse">

                    <div class="accordion-body">

                        <textarea
                            id="about"
                            placeholder="Write your professional summary">
                        </textarea>

                    </div>

                </div>

            </div>


            <!-- Experience -->

            <div class="accordion-item">

                <h2 class="accordion-header">

                    <button
                        class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#experience">

                        Experience

                    </button>

                </h2>


                <div
                    id="experience"
                    class="accordion-collapse collapse">

                    <div class="accordion-body">


                        <label>Company Name</label>

                        <input
                            type="text"
                            id="company">

                        <br><br>


                        <label>Role</label>

                        <input
                            type="text"
                            id="exp_role">

                        <br><br>


                        <label>Start Date</label>

                        <input
                            type="month"
                            id="start_date">

                        <br><br>


                        <label>End Date</label>

                        <input
                            type="month"
                            id="end_date">

                        <br><br>


                        <label>Responsibilities / Achievements</label>

                        <textarea
                            id="description"
                            placeholder="Example:
Tested web applications
Created test cases
Reported defects">
                        </textarea>

                    </div>

                </div>

            </div>


            <!-- Education -->

            <div class="accordion-item">

                <h2 class="accordion-header">

                    <button
                        class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#education">

                        Education

                    </button>

                </h2>


                <div
                    id="education"
                    class="accordion-collapse collapse">

                    <div class="accordion-body">


                        <label>Institute Name</label>

                        <input
                            type="text"
                            id="institute">

                        <br><br>


                        <label>Department / Degree</label>

                        <input
                            type="text"
                            id="department">

                        <br><br>


                        <label>Passout Year</label>

                        <input
                            type="number"
                            id="passout"
                            placeholder="Example: 2022">

                        <br><br>


                        <label>Percentage</label>

                        <input
                            type="number"
                            id="percentage"
                            placeholder="Example: 75">

                    </div>

                </div>

            </div>


            <!-- Skills -->

            <div class="accordion-item">

                <h2 class="accordion-header">

                    <button
                        class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#skills">

                        Skills

                    </button>

                </h2>


                <div
                    id="skills"
                    class="accordion-collapse collapse">

                    <div class="accordion-body">

                        <label>Skills</label>

                        <input
                            type="text"
                            id="skill"
                            placeholder="Example: Java, SQL, Selenium, Playwright">

                    </div>

                </div>

            </div>


        </div>

    </div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">

</script>
<script src="script.js"></script>
</body>

</html>
