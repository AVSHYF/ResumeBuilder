<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ATS Resume Builder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>

        body {
            background-color: #f5f5f5;
        }

        /* ATS Resume */

        .resume {
            width: 100%;
            min-height: 297mm;
            padding: 40px;
            background: white;
            color: black;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Name */

        #p_name {
            text-align: center;
            font-size: 30px;
            font-weight: 700;
            margin: 0 0 4px 0;
        }

        /* Role */

        #p_role {
            text-align: center;
            font-size: 16px;
            margin: 0 0 10px 0;
        }

        /* Contact */

        .contact {
            text-align: center;
            font-size: 13px;
            margin-bottom: 20px;
        }

        /* Section */

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;

            border-bottom: 2px solid black;

            padding-bottom: 4px;
            margin-bottom: 10px;
        }

        /* Experience */

        .company {
            font-size: 16px;
            font-weight: bold;
        }

        .exp-role {
            font-size: 14px;
            font-weight: 600;
        }

        .exp-date {
            font-size: 13px;
            color: #444;
            margin-bottom: 5px;
        }

        #p_desc {
            white-space: pre-line;
        }

        /* Education */

        .institute {
            font-weight: bold;
            font-size: 15px;
        }

        .department {
            font-size: 14px;
        }

        .percentage {
            font-size: 14px;
        }

        /* Skills */

        .skill-list {
            font-size: 14px;
        }

        /* Form */

        .resume-form input,
        .resume-form textarea {
            width: 100%;
            padding: 7px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .resume-form textarea {
            min-height: 100px;
        }

        /* Printing */

        @media print {

            body {
                background: white;
            }

            .resume-form,
            .page-title {
                display: none;
            }

            .resume {
                width: 100%;
                padding: 20px;
                margin: 0;
            }
        }

        
    </style>

</head>

<body>

<h1 class="text-center my-4 page-title">
    Create Your Resume
</h1>

<div class="container-fluid">

<div class="row">
    <div class="col-md-6">

    <!-- ========================= -->
    <!-- RESUME PREVIEW -->
    <!-- ========================= -->
     <div class="d-flex justify-content-between align-items-center mb-3">

    <h4 class="fw-bold">
        Resume Preview
    </h4>

    <button
        id="downloadResume"
        class="btn btn-primary">

        <i class="bi bi-file-earmark-arrow-down me-2"></i>

        Download PDF

    </button>

</div>

    

        <div class="resume" id="resumePreview">

            <h1 id="p_name"></h1>

            <p id="p_role"></p>


            <!-- Contact -->

            <div class="contact">

                <span id="p_mail"></span>

                <span id="mail_separator"></span>

                <span id="p_phone"></span>

                <span id="phone_separator"></span>

                <span id="p_address"></span>

            </div>


            <!-- About -->

            <div class="section">

                <div class="section-title">
                    Professional Summary
                </div>

                <p id="p_about"></p>

            </div>


            <!-- Experience -->

            <div class="section">

                <div class="section-title">
                    Experience
                </div>

                <div
                    class="company"
                    id="p_company">
                </div>

                <div
                    class="exp-role"
                    id="p_exp_role">
                </div>

                <div class="exp-date">

                    <span id="p_start_date"></span>

                    <span id="date_separator"></span>

                    <span id="p_end_date"></span>

                </div>

                <p id="p_desc"></p>

            </div>


            <!-- Education -->

            <div class="section">

                <div class="section-title">
                    Education
                </div>

                <div
                    class="institute"
                    id="p_institute">
                </div>

                <div
                    class="department"
                    id="p_department">
                </div>

                <div>
                    <span id="p_passout"></span>
                </div>

                <div
                    class="percentage"
                    id="p_percentage">
                </div>

            </div>


            <!-- Skills -->

            <div class="section">

                <div class="section-title">
                    Skills
                </div>

                <div
                    class="skill-list"
                    id="p_skill">
                </div>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- FORM -->
    <!-- ========================= -->

    <div class="col-md-6 resume-form">

        <div class="accordion" id="resumeAccordion">


            <!-- Personal Details -->

            <div class="accordion-item">

                <h2 class="accordion-header">

                    <button
                        class="accordion-button"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#personal">

                        Personal Details

                    </button>

                </h2>


                <div
                    id="personal"
                    class="accordion-collapse collapse show">

                    <div class="accordion-body">

                        <label>Name</label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name">

                        <br><br>


                        <label>Role</label>

                        <input
                            type="text"
                            id="role"
                            placeholder="Example: Software Tester">

                        <br><br>


                        <label>Email</label>

                        <input
                            type="email"
                            id="mail"
                            placeholder="Enter email">

                        <br><br>


                        <label>Phone</label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter phone number">

                        <br><br>


                        <label>Location</label>

                        <input
                            type="text"
                            id="address"
                            placeholder="Example: Madurai, Tamil Nadu">

                    </div>

                </div>

            </div>


            <!-- Summary -->

            <div class="accordion-item">

                <h2 class="accordion-header">

                    <button
                        class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#summary">

                        Professional Summary

                    </button>

                </h2>


                <div
                    id="summary"
                    class="accordion-collapse collapse">

                    <div class="accordion-body">

                        <textarea
                            id="about"
                            placeholder="Write your professional summary">
                        </textarea>

                    </div>

                </div>

            </div>


            <!-- Experience -->

            <div class="accordion-item">

                <h2 class="accordion-header">

                    <button
                        class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#experience">

                        Experience

                    </button>

                </h2>


                <div
                    id="experience"
                    class="accordion-collapse collapse">

                    <div class="accordion-body">


                        <label>Company Name</label>

                        <input
                            type="text"
                            id="company">

                        <br><br>


                        <label>Role</label>

                        <input
                            type="text"
                            id="exp_role">

                        <br><br>


                        <label>Start Date</label>

                        <input
                            type="month"
                            id="start_date">

                        <br><br>


                        <label>End Date</label>

                        <input
                            type="month"
                            id="end_date">

                        <br><br>


                        <label>Responsibilities / Achievements</label>

                        <textarea
                            id="description"
                            placeholder="Example:
Tested web applications
Created test cases
Reported defects">
                        </textarea>

                    </div>

                </div>

            </div>


            <!-- Education -->

            <div class="accordion-item">

                <h2 class="accordion-header">

                    <button
                        class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#education">

                        Education

                    </button>

                </h2>


                <div
                    id="education"
                    class="accordion-collapse collapse">

                    <div class="accordion-body">


                        <label>Institute Name</label>

                        <input
                            type="text"
                            id="institute">

                        <br><br>


                        <label>Department / Degree</label>

                        <input
                            type="text"
                            id="department">

                        <br><br>


                        <label>Passout Year</label>

                        <input
                            type="number"
                            id="passout"
                            placeholder="Example: 2022">

                        <br><br>


                        <label>Percentage</label>

                        <input
                            type="number"
                            id="percentage"
                            placeholder="Example: 75">

                    </div>

                </div>

            </div>


            <!-- Skills -->

            <div class="accordion-item">

                <h2 class="accordion-header">

                    <button
                        class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#skills">

                        Skills

                    </button>

                </h2>


                <div
                    id="skills"
                    class="accordion-collapse collapse">

                    <div class="accordion-body">

                        <label>Skills</label>

                        <input
                            type="text"
                            id="skill"
                            placeholder="Example: Java, SQL, Selenium, Playwright">

                    </div>

                </div>

            </div>


        </div>

    </div>

</div>

</div>


<script>

    // Reusable live preview function

    function bindPreview(inputId, previewId) {

        const input =
            document.getElementById(inputId);

        const preview =
            document.getElementById(previewId);


        input.addEventListener("input", function () {

            preview.textContent = this.value;

        });

    }


    // Personal Details

    bindPreview("name", "p_name");

    bindPreview("role", "p_role");

    bindPreview("mail", "p_mail");

    bindPreview("phone", "p_phone");

    bindPreview("address", "p_address");


    // Summary

    bindPreview("about", "p_about");


    // Experience

    bindPreview("company", "p_company");

    bindPreview("exp_role", "p_exp_role");

    bindPreview("start_date", "p_start_date");

    bindPreview("end_date", "p_end_date");

    bindPreview("description", "p_desc");


    // Education

    bindPreview("institute", "p_institute");

    bindPreview("department", "p_department");

    bindPreview("passout", "p_passout");


    // Percentage

    document
        .getElementById("percentage")
        .addEventListener("input", function () {

            if (this.value) {

                document.getElementById("p_percentage")
                    .textContent =
                    "Percentage: " + this.value + "%";

            } else {

                document.getElementById("p_percentage")
                    .textContent = "";

            }

        });


    // Skills

    bindPreview("skill", "p_skill");


    // Contact separators

    function updateContact() {

        const email =
            document.getElementById("mail").value;

        const phone =
            document.getElementById("phone").value;

        const address =
            document.getElementById("address").value;


        document.getElementById("mail_separator")
            .textContent =
            email && (phone || address) ? " | " : "";


        document.getElementById("phone_separator")
            .textContent =
            phone && address ? " | " : "";

    }


    document.getElementById("mail")
        .addEventListener("input", updateContact);

    document.getElementById("phone")
        .addEventListener("input", updateContact);

    document.getElementById("address")
        .addEventListener("input", updateContact);


    // Experience date separator

    function updateDateSeparator() {

        const start =
            document.getElementById("start_date").value;

        const end =
            document.getElementById("end_date").value;


        document.getElementById("date_separator")
            .textContent =
            start && end ? " - " : "";

    }


    document.getElementById("start_date")
        .addEventListener("input", updateDateSeparator);

    document.getElementById("end_date")
        .addEventListener("input", updateDateSeparator);

</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">

</script>
<script>
    document
.getElementById("downloadResume")
.addEventListener("click", function () {

    const element =
        document.getElementById("resumePreview");

    const options = {

        margin: 0.5,

        filename: "Resume.pdf",

        image: {
            type: "jpeg",
            quality: 1
        },

        html2canvas: {
            scale: 2
        },

        jsPDF: {
            unit: "in",
            format: "a4",
            orientation: "portrait"
        }

    };

    html2pdf()
        .set(options)
        .from(element)
        .save();

});
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

</body>

</html>
