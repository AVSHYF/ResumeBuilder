<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ATS Resume Builder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    

</head>

<body style="background-color: bisque; padding-bottom: 200px;">
<div class="text-start my-4 page-title container-fluid row" style="position: sticky; background-color: bisque;" >
    <div class="container col-6 align-items-start " style="font-size: 25px; "> 
        <h1>Create Your Resume</h1></div>
<div class="d-flex justify-content-between align-items-end mb-3 col-2">
    <button
        id="downloadResume"
        class="btn btn-primary align-items-end">

        <i class="bi bi-file-earmark-arrow-down me-2"></i>

        Download PDF

    </button>

</div>
</div>
<div class="container-fluid " style="padding-left: 20px; padding-right: 20px;">
      


<div class="row g-4 align-items-start " >

    <div class="col-lg-6 d-flex justify-content-center">


    <!-- ========================= -->
    <!-- RESUME PREVIEW -->
    <!-- ========================= -->
   
    

        <div class="resume" id="resumePreview" style="position: sticky; " >

            <h1 id="p_name"></h1>

            <p id="p_role"></p>


            <!-- Contact -->

            <div class="contact">

                <span id="p_mail"></span>

                <span id="mail_separator"></span>

                <span id="p_phone"></span>

                <span id="phone_separator"></span>

                <span id="p_address"></span>

            </div>


            <!-- About -->

            <div class="section">

                <div class="section-title">
                    Professional Summary
                </div>

                <p id="p_about"></p>

            </div>


            <!-- Experience -->

            <div class="section">

                <div class="section-title">
                    Experience
                </div>

                <div
                    class="company"
                    id="p_company">
                </div>

                <div
                    class="exp-role"
                    id="p_exp_role">
                </div>

                <div class="exp-date">

                    <span id="p_start_date"></span>

                    <span id="date_separator"></span>

                    <span id="p_end_date"></span>

                </div>

                <p id="p_desc"></p>

            </div>


            <!-- Education -->

            <div class="section">

                <div class="section-title">
                    Education
                </div>

                <div
                    class="institute"
                    id="p_institute">
                </div>

                <div
                    class="department"
                    id="p_department">
                </div>

                <div>
                    <span id="p_passout"></span>
                </div>

                <div
                    class="percentage"
                    id="p_percentage">
                </div>

            </div>


            <!-- Skills -->

            <div class="section">

                <div class="section-title">
                    Skills
                </div>

                <div
                    class="skill-list"
                    id="p_skill">
                </div>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- FORM -->
    <!-- ========================= -->

    <div class="col-lg-6 resume-form">

    <!-- Personal Details -->
    <div class="card mb-3 shadow-sm">
        <div class="card-header fw-bold">
            Personal Details
        </div>

        <div class="card-body">

            <label>Name</label>
            <input type="text" id="name" placeholder="Enter your name">
            <br><br>

            <label>Role</label>
            <input type="text" id="role" placeholder="Example: Software Tester">
            <br><br>

            <label>Email</label>
            <input type="email" id="mail" placeholder="Enter email">
            <br><br>

            <label>Phone</label>
            <input type="tel" id="phone" placeholder="Enter phone number">
            <br><br>

            <label>Location</label>
            <input type="text" id="address" placeholder="Example: Madurai, Tamil Nadu">

        </div>
    </div>

    <!-- Professional Summary -->
    <div class="card mb-3 shadow-sm">
        <div class="card-header fw-bold">
            Professional Summary
        </div>

        <div class="card-body">

            <textarea
                id="about"
                placeholder="Write your professional summary">
            </textarea>

        </div>
    </div>

    <!-- Experience -->
    <div class="card mb-3 shadow-sm">
        <div class="card-header fw-bold">
            Experience
        </div>

        <div class="card-body">

            <label>Company Name</label>
            <input type="text" id="company">
            <br><br>

            <label>Role</label>
            <input type="text" id="exp_role">
            <br><br>

            <label>Start Date</label>
            <input type="month" id="start_date">
            <br><br>

            <label>End Date</label>
            <input type="month" id="end_date">
            <br><br>

            <label>Responsibilities / Achievements</label>
            <textarea
                id="description"
                placeholder="Example:
Tested web applications
Created test cases
Reported defects">
            </textarea>

        </div>
    </div>

    <!-- Education -->
    <div class="card mb-3 shadow-sm">
        <div class="card-header fw-bold">
            Education
        </div>

        <div class="card-body">

            <label>Institute Name</label>
            <input type="text" id="institute">
            <br><br>

            <label>Department / Degree</label>
            <input type="text" id="department">
            <br><br>

            <label>Passout Year</label>
            <input type="number" id="passout" placeholder="Example: 2022">
            <br><br>

            <label>Percentage</label>
            <input type="number" id="percentage" placeholder="Example: 75">

        </div>
    </div>

    <!-- Skills -->
    <div class="card mb-3 shadow-sm">
        <div class="card-header fw-bold">
            Skills
        </div>

        <div class="card-body">

            <label>Skills</label>
            <input
                type="text"
                id="skill"
                placeholder="Example: Java, SQL, Selenium, Playwright">

        </div>
    </div>

</div>

</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">

</script>

<script>
    document
.getElementById("downloadResume")
.addEventListener("click", function () {

    const element =
        document.getElementById("resumePreview");

    const options = {

        margin: 0.5,

        filename: "Resume.pdf",

        image: {
            type: "jpeg",
            quality: 1
        },

        html2canvas: {
            scale: 2
        },

        jsPDF: {
            unit: "in",
            format: "a4",
            orientation: "portrait"
        }

    };

    html2pdf()
        .set(options)
        .from(element)
        .save();

});

</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script src="script.js"></script>
</body>

</html>
